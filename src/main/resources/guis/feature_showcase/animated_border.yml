# Two moving trails like the Meteor Strike reference. Usage: /animatedborder
# Static controls stay inside the perimeter so the animation cannot replace them.
animated_border:
  title: "&6&lMeteor Strike"
  rows: 5
  commands: [ "animatedborder" ]
