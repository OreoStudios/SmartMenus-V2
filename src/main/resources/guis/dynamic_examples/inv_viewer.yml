# ============================================================
# EXAMPLE 26 — DYNAMIC_PAGINATION + PLAYER_INVENTORY / PLAYER_ENDERCHEST
#
# inv_viewer       — shows inventory items; click removes them (take-item).
# enderchest_viewer — shows ender chest items; click gives them to inventory
#                    (give-item) and removes from ender chest (take-item).
#
# Usage: /invview  /inventoryview
#        /enderchestview  /ecview
# ============================================================

# ── Inventory viewer (take-item) ────────────────────────────────────────────
inv_viewer:
  title: "&d&l🎒 Your Inventory"
  rows: 6
  commands: [ "invview", "inventoryview" ]

  items:

    border:
      slots: [ 0-8, 45-53 ]
      material: PURPLE_STAINED_GLASS_PANE
      name: "&8"

    inv-items:
      type: DYNAMIC_PAGINATION
      source: PLAYER_INVENTORY
      slots: [ 9-44 ]
      # material is ignored — the actual ItemStack from inventory is rendered
      material: STONE
      name: "&f%item_name%"
      lore:
        - "&7Amount: &e%item_amount%"
        - "&7Inventory slot: &f%item_slot%"
        - ""
        - "&cClick &7to remove from inventory"
      # take-item: true removes the item from the player's inventory on click
      take-item: true

    previous-btn:
      type: PREVIOUS
      slot: 48
      material: ARROW
      name: "&c&l← Previous"
      is-permanent: false

    next-btn:
      type: NEXT
      slot: 50
      material: ARROW
      name: "&a&lNext →"
      is-permanent: false

    close-btn:
      slot: 53
      material: BARRIER
      name: "&c&lClose"
      close: true

# ── Ender chest viewer (give-item + take-item) ──────────────────────────────
# give-item: true  → a copy of the clicked item is added to the player's
#                    main inventory (drops at feet if inventory is full).
# take-item: true  → the item is simultaneously removed from the ender chest.
# Use both together to "move" items from ender chest → main inventory.
enderchest_viewer:
  title: "&5&l📦 Your Ender Chest"
  rows: 6
  commands: [ "enderchestview", "ecview" ]
  auto-convert: true

  items:

    border:
      slots: [ 0-8, 45-53 ]
      material: PURPLE_STAINED_GLASS_PANE
      name: "&8"

    ec-items:
      type: DYNAMIC_PAGINATION
      source: PLAYER_ENDERCHEST
      slots: [ 9-44 ]
      material: STONE
      name: "&f%item_name%"
      lore:
        - "&7Amount: &e%item_amount%"
        - "&7Ender chest slot: &f%item_slot%"
        - ""
        - "&aClick &7to move to your inventory"
      # give-item adds the item to the player's main inventory on click
      give-item: true
      # take-item removes it from the ender chest on click
      take-item: true

    previous-btn:
      type: PREVIOUS
      slot: 48
      material: ARROW
      name: "&c&l← Previous"
      is-permanent: false

    next-btn:
      type: NEXT
      slot: 50
      material: ARROW
      name: "&a&lNext →"
      is-permanent: false

    close-btn:
      slot: 53
      material: BARRIER
      name: "&c&lClose"
      close: true
