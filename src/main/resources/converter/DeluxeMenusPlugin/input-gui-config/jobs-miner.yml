    left_click_commands:
    - '[sound] ITEM_ARMOR_EQUIP_LEATHER 2 0.4'
    - '[player] jobs leave miner'
    - '[refresh]' 
  MINER-WARNING:
    material: paper
    model_data: 10006
    display_name: '&#e64427ǫᴜɪᴛᴛᴇʀ'
    slot: 7 
    priority: 1
    view_requirement:
      requirements:
        jobs_requirement:
         type: string contains
         input: "%jobsr_user_isin_miner%"
         output: 'Vrai'
        jobs_requirement_2:
