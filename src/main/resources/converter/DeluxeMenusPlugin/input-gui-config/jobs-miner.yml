    - ''
    - '&f:left_click: &#fad766ᴄʟɪǫᴜᴇᴢ: ᴀᴄᴄᴇᴅᴇʀ'
    left_click_commands:
    - '[sound] ITEM_ARMOR_EQUIP_LEATHER 2 0.4'
    - '[player] jobs leave miner'
    - '[refresh]' 
  MINER-DISABLE:
    material: paper
    model_data: 10006
    display_name: '&#e64427ǫᴜɪᴛᴛᴇʀ'
    slot: 7 
    priority: 0
    view_requirement:
      requirements:
        jobs_requirement:
         type: string contains
         input: "%jobsr_user_isin_miner%"
         output: 'Faux'
        jobs_requirement_2:
         type: javascript
         expression: "%jobsr_user_joinedjobcount% == %jobsr_maxjobs%"
    lore:
    - '&8❯ sʏsᴛᴇᴍᴇ'
    - '' 
    - '&cVous avez atteint la limite maximale'
    - '&cd''emplois qu''un joueur peut avoir!'
    - ''
    - '&cVous devez quitter un emploi pour pouvoir'
    - '&cpouvoir en rejoindre d''autres, ou farmer'
    - '&c lesprestiges (/prestiges).'
    left_click_commands:
      - "[sound] BLOCK_NOTE_BLOCK_BASS"
      - "[message] &8(&#D77351✘&8) &#D77351Vous avez déjà rejoint trop de métiers !"
      - "[close]"
