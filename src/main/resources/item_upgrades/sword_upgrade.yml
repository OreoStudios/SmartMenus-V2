# ============================================================
# EXAMPLE — Sword with 5 rarity levels
# Admin commands:
#   /smartmenus itemlevel give <player> diamond_sword <1-5>
#   /smartmenus itemlevel set  <player> diamond_sword <1-5>
#   /smartmenus itemlevel check [player]
# ============================================================
diamond_sword:
  levels:
    1:
      material: WOODEN_SWORD
      name: "&7[★] Sword &8(Common)"
      lore:
        - "&8Rarity: &7Common"
        - "&7Level: &f1 &8/ 5"
        - ""
        - "&7Damage: &c+2"
    2:
      material: STONE_SWORD
      name: "&a[★★] Sword &a(Uncommon)"
      lore:
        - "&8Rarity: &aUncommon"
        - "&7Level: &f2 &8/ 5"
        - ""
        - "&7Damage: &c+5"
      enchantments:
        sharpness: 1
    3:
      material: IRON_SWORD
      name: "&b[★★★] Sword &b(Rare)"
      lore:
        - "&8Rarity: &bRare"
        - "&7Level: &f3 &8/ 5"
        - ""
        - "&7Damage: &c+9"
      enchantments:
        sharpness: 2
    4:
      material: DIAMOND_SWORD
      name: "&d[★★★★] Sword &d(Epic)"
      lore:
        - "&8Rarity: &dEpic"
        - "&7Level: &f4 &8/ 5"
        - ""
        - "&7Damage: &c+15"
      enchantments:
        sharpness: 4
        fire_aspect: 1
    5:
      material: NETHERITE_SWORD
      name: "&6[★★★★★] Sword &6(Legendary)"
      lore:
        - "&8Rarity: &6Legendary"
        - "&7Level: &f5 &8/ 5"
        - ""
        - "&7Damage: &c+25"
        - "&7&oOne of a kind..."
      enchantments:
        sharpness: 5
        fire_aspect: 2
        looting: 3
      glow: true
      item_flags:
        - HIDE_ENCHANTS
